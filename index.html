<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#001E1F" />
  <meta name="description" content="EcoRay salgsfejring - tryk SALG og spil lyden." />
  <title>EcoRay · Salg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --eco-surface: #001E1F;
      --eco-green-deep: #05292C;
      --eco-surface-alt: #061613;
      --eco-brand: #1BFC9E;
      --eco-paper: #F7F5EE;
      --eco-neutral-050: #F1F0ED;
      --eco-neutral-200: #D2D1CD;
      --eco-ink: #051111;
      --eco-success: #009E3B;
      --ring: color-mix(in srgb, var(--eco-brand) 35%, transparent);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(1000px 520px at 50% -15%, color-mix(in srgb, var(--eco-brand) 14%, transparent), transparent 55%),
        radial-gradient(700px 380px at 100% 110%, color-mix(in srgb, var(--eco-success) 18%, transparent), transparent 50%),
        linear-gradient(165deg, var(--eco-surface) 0%, var(--eco-green-deep) 55%, var(--eco-surface-alt) 100%);
      color: var(--eco-paper);
      font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      min-height: 100dvh;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: "EcoRay";
      position: fixed;
      inset: auto 0 8% 0;
      text-align: center;
      font-size: clamp(4rem, 18vw, 9rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      color: color-mix(in srgb, var(--eco-brand) 7%, transparent);
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }
    .wrap {
      width: min(560px, 100%);
      display: grid;
      gap: 16px;
      position: relative;
      z-index: 1;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--eco-brand);
      font-weight: 700;
      letter-spacing: -0.02em;
      font-size: 1.05rem;
    }
    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: linear-gradient(145deg, var(--eco-brand), color-mix(in srgb, var(--eco-brand) 40%, var(--eco-success)));
      box-shadow: 0 0 24px color-mix(in srgb, var(--eco-brand) 35%, transparent);
    }
    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(1.45rem, 4vw, 2rem);
      letter-spacing: -0.03em;
      color: var(--eco-paper);
      font-weight: 700;
    }
    .sub {
      text-align: center;
      color: color-mix(in srgb, var(--eco-paper) 68%, var(--eco-neutral-200));
      margin: -4px 0 2px;
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .card {
      background: color-mix(in srgb, var(--eco-surface-alt) 82%, black 18%);
      border: 1px solid color-mix(in srgb, var(--eco-brand) 16%, transparent);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
    }
    .boom {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 30px 18px;
      font-size: clamp(1.5rem, 5.2vw, 2.2rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--eco-ink);
      background: linear-gradient(135deg, #7dffc6 0%, var(--eco-brand) 42%, #12d98a 100%);
      box-shadow:
        0 0 0 0 var(--ring),
        0 14px 36px color-mix(in srgb, var(--eco-brand) 32%, transparent);
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s ease, box-shadow 0.15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }
    .boom:hover { filter: brightness(1.04); }
    .boom:active { transform: scale(0.985); }
    .boom.pulse { animation: pulse 0.95s ease-out 1; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 var(--ring), 0 14px 36px color-mix(in srgb, var(--eco-brand) 32%, transparent); }
      70% { box-shadow: 0 0 0 30px transparent, 0 14px 36px color-mix(in srgb, var(--eco-brand) 18%, transparent); }
      100% { box-shadow: 0 0 0 0 transparent, 0 14px 36px color-mix(in srgb, var(--eco-brand) 32%, transparent); }
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn {
      border: 1px solid color-mix(in srgb, var(--eco-paper) 14%, transparent);
      background: color-mix(in srgb, var(--eco-paper) 5%, transparent);
      color: var(--eco-paper);
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { background: color-mix(in srgb, var(--eco-paper) 10%, transparent); }
    .btn.stop {
      border-color: color-mix(in srgb, #ef4444 45%, transparent);
      color: #fecaca;
    }
    label.field {
      display: grid;
      gap: 8px;
      color: color-mix(in srgb, var(--eco-paper) 72%, var(--eco-neutral-200));
      font-size: 0.9rem;
      font-weight: 500;
    }
    select, input[type="range"], input[type="file"] { width: 100%; accent-color: var(--eco-brand); }
    select {
      background: var(--eco-green-deep);
      color: var(--eco-paper);
      border: 1px solid color-mix(in srgb, var(--eco-brand) 22%, transparent);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
      font-family: inherit;
    }
    input[type="file"] {
      color: color-mix(in srgb, var(--eco-paper) 75%, transparent);
      font-size: 0.9rem;
    }
    .hint {
      color: color-mix(in srgb, var(--eco-paper) 62%, var(--eco-neutral-200));
      font-size: 0.85rem;
      line-height: 1.45;
      margin: 0;
    }
    .status {
      text-align: center;
      min-height: 1.25em;
      font-weight: 600;
      color: var(--eco-brand);
      margin: 12px 0 0;
    }
    .confetti {
      pointer-events: none;
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 50;
    }
    .piece {
      position: absolute;
      top: -12px;
      width: 10px;
      height: 14px;
      border-radius: 2px;
      animation: fall linear forwards;
    }
    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0.85;
      }
    }
    kbd {
      font: 600 0.8em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      border: 1px solid color-mix(in srgb, var(--eco-paper) 22%, transparent);
      border-bottom-width: 2px;
      border-radius: 6px;
      padding: 1px 6px;
      background: color-mix(in srgb, var(--eco-paper) 8%, transparent);
    }
    .footer {
      text-align: center;
      font-size: 0.78rem;
      color: color-mix(in srgb, var(--eco-paper) 45%, transparent);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand" aria-label="EcoRay">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>EcoRay</span>
    </div>
    <div>
      <h1>Salg fejring</h1>
      <p class="sub">Tryk knappen. Spil lyden. Fejr dealet.</p>
    </div>

    <div class="card">
      <button id="boom" class="boom" type="button" aria-label="Fejr salg">SALG!</button>
      <p id="status" class="status" aria-live="polite"></p>
      <div class="row" style="margin-top:12px">
        <button id="stop" class="btn stop" type="button">Stop</button>
        <button id="test" class="btn" type="button">Test lyd</button>
      </div>
    </div>

    <div class="card" style="display:grid;gap:14px">
      <label class="field">
        Lyd
        <select id="sound">
          <option value="fanfare">Fanfare</option>
          <option value="cash">Kasseapparat</option>
          <option value="airhorn">Airhorn</option>
          <option value="cheer">Jubel</option>
          <option value="custom">Egen fil / sang</option>
        </select>
      </label>

      <label class="field" id="fileWrap" hidden>
        Vælg MP3 / WAV / M4A
        <input id="file" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg" />
      </label>

      <label class="field">
        Volumen <span id="volLabel">80%</span>
        <input id="volume" type="range" min="0" max="100" value="80" />
      </label>

      <p class="hint">
        Stream Deck: Website-tast med denne URL, eller Hotkey <kbd>Space</kbd> mens fanen er aktiv.
        Første tryk aktiverer lyd i browseren.
      </p>
    </div>
    <p class="footer">Intern salgsfejring · EcoRay</p>
  </div>

  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const boomBtn = $("boom");
    const stopBtn = $("stop");
    const testBtn = $("test");
    const soundSel = $("sound");
    const fileInput = $("file");
    const fileWrap = $("fileWrap");
    const volume = $("volume");
    const volLabel = $("volLabel");
    const statusEl = $("status");
    const confettiEl = $("confetti");

    let audioCtx = null;
    let customUrl = null;
    let customAudio = null;
    let activeNodes = [];
    let customPlaying = null;

    const saved = JSON.parse(localStorage.getItem("ecoraySalesCelebration") || "{}");
    if (saved.sound) soundSel.value = saved.sound;
    if (typeof saved.volume === "number") volume.value = saved.volume;
    volLabel.textContent = volume.value + "%";
    fileWrap.hidden = soundSel.value !== "custom";

    function persist() {
      localStorage.setItem("ecoraySalesCelebration", JSON.stringify({
        sound: soundSel.value,
        volume: Number(volume.value),
      }));
    }

    function setStatus(t) { statusEl.textContent = t || ""; }

    function ensureCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function vol() {
      return Math.max(0, Math.min(1, Number(volume.value) / 100));
    }

    function stopAll() {
      activeNodes.splice(0).forEach((n) => {
        try { n.stop(); } catch (_) {}
        try { n.disconnect(); } catch (_) {}
      });
      if (customPlaying) {
        try { customPlaying.pause(); customPlaying.currentTime = 0; } catch (_) {}
        customPlaying = null;
      }
      if (customAudio) {
        try { customAudio.pause(); customAudio.currentTime = 0; } catch (_) {}
      }
      setStatus("");
    }

    function tone(freq, start, dur, type, gainVal) {
      const ctx = ensureCtx();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, start);
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(gainVal * vol(), start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(start);
      o.stop(start + dur + 0.02);
      activeNodes.push(o);
    }

    function noiseBurst(start, dur, gainVal) {
      const ctx = ensureCtx();
      const len = Math.floor(ctx.sampleRate * dur);
      const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ctx.createBufferSource();
      const g = ctx.createGain();
      const f = ctx.createBiquadFilter();
      f.type = "bandpass";
      f.frequency.value = 1800;
      src.buffer = buffer;
      g.gain.setValueAtTime(gainVal * vol(), start);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      src.connect(f);
      f.connect(g);
      g.connect(ctx.destination);
      src.start(start);
      src.stop(start + dur + 0.02);
      activeNodes.push(src);
    }

    function playFanfare() {
      const ctx = ensureCtx();
      const t = ctx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
      notes.forEach((f, i) => tone(f, t + i * 0.12, 0.28, i === notes.length - 1 ? "sawtooth" : "triangle", 0.22));
      tone(1318.5, t + 0.72, 0.55, "square", 0.12);
    }

    function playCash() {
      const ctx = ensureCtx();
      const t = ctx.currentTime;
      for (let i = 0; i < 8; i++) tone(2400 + i * 80, t + i * 0.04, 0.05, "square", 0.08);
      noiseBurst(t + 0.35, 0.25, 0.2);
      tone(880, t + 0.4, 0.2, "triangle", 0.15);
      tone(1320, t + 0.55, 0.25, "triangle", 0.12);
    }

    function playAirhorn() {
      const ctx = ensureCtx();
      const t = ctx.currentTime;
      const o = ctx.createOscillator();
      const o2 = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sawtooth";
      o2.type = "square";
      o.frequency.setValueAtTime(174.61, t);
      o2.frequency.setValueAtTime(174.61 * 1.01, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.28 * vol(), t + 0.05);
      g.gain.setValueAtTime(0.28 * vol(), t + 0.9);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
      o.connect(g);
      o2.connect(g);
      g.connect(ctx.destination);
      o.start(t);
      o2.start(t);
      o.stop(t + 1.45);
      o2.stop(t + 1.45);
      activeNodes.push(o, o2);
    }

    function playCheer() {
      const ctx = ensureCtx();
      const t = ctx.currentTime;
      for (let i = 0; i < 12; i++) {
        tone(400 + Math.random() * 900, t + i * 0.05, 0.18 + Math.random() * 0.2, "triangle", 0.06);
      }
      noiseBurst(t, 0.8, 0.18);
      tone(523.25, t + 0.2, 0.4, "square", 0.1);
      tone(659.25, t + 0.35, 0.45, "square", 0.1);
      tone(783.99, t + 0.5, 0.6, "sawtooth", 0.12);
    }

    async function playCustom() {
      if (!customUrl) {
        setStatus("Vælg en lydfil først");
        return;
      }
      ensureCtx();
      if (!customAudio) customAudio = new Audio();
      customAudio.src = customUrl;
      customAudio.volume = vol();
      customPlaying = customAudio;
      try {
        await customAudio.play();
        setStatus("Spiller din sang…");
      } catch (e) {
        setStatus("Kunne ikke afspille filen (klik igen efter filvalg)");
      }
    }

    function confetti() {
      const colors = ["#1BFC9E", "#009E3B", "#F7F5EE", "#7dffc6", "#D2D1CD", "#12d98a"];
      for (let i = 0; i < 48; i++) {
        const p = document.createElement("div");
        p.className = "piece";
        p.style.left = Math.random() * 100 + "vw";
        p.style.background = colors[i % colors.length];
        p.style.animationDuration = 0.9 + Math.random() * 1.2 + "s";
        p.style.animationDelay = Math.random() * 0.15 + "s";
        p.style.transform = "rotate(" + Math.random() * 360 + "deg)";
        confettiEl.appendChild(p);
        setTimeout(() => p.remove(), 2200);
      }
    }

    async function celebrate(isTest) {
      stopAll();
      boomBtn.classList.remove("pulse");
      void boomBtn.offsetWidth;
      boomBtn.classList.add("pulse");
      if (!isTest) confetti();
      const mode = soundSel.value;
      setStatus(isTest ? "Test…" : "SALG!");
      if (mode === "fanfare") playFanfare();
      else if (mode === "cash") playCash();
      else if (mode === "airhorn") playAirhorn();
      else if (mode === "cheer") playCheer();
      else await playCustom();
      if (mode !== "custom") {
        setTimeout(() => {
          if (statusEl.textContent === (isTest ? "Test…" : "SALG!")) setStatus("");
        }, 1600);
      }
    }

    boomBtn.addEventListener("click", () => celebrate(false));
    testBtn.addEventListener("click", () => celebrate(true));
    stopBtn.addEventListener("click", stopAll);
    volume.addEventListener("input", () => {
      volLabel.textContent = volume.value + "%";
      if (customAudio) customAudio.volume = vol();
      persist();
    });
    soundSel.addEventListener("change", () => {
      fileWrap.hidden = soundSel.value !== "custom";
      persist();
    });
    fileInput.addEventListener("change", () => {
      const f = fileInput.files && fileInput.files[0];
      if (!f) return;
      if (customUrl) URL.revokeObjectURL(customUrl);
      customUrl = URL.createObjectURL(f);
      soundSel.value = "custom";
      fileWrap.hidden = false;
      persist();
      setStatus("Klar: " + f.name);
    });

    window.addEventListener("keydown", (e) => {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA")) return;
      if (e.code === "Space" || e.key === "Enter") {
        e.preventDefault();
        celebrate(false);
      }
      if (e.key === "Escape") stopAll();
    });

    window.addEventListener("pointerdown", () => { try { ensureCtx(); } catch (_) {} }, { once: true });
  </script>
</body>
</html>
